			(function () {
				var theme = 'light';

					var stored = localStorage.getItem('theme');

					else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
				} catch (e) {}
				document.documentElement.setAttribute('data-theme', theme);
			})();
